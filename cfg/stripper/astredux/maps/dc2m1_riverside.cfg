; Skip the opening camera sequence without skipping the map's start/finish work.
; Keep the survivor spawn positions and the train movement used by the later event.
modify:
{
	match:
	{
		"classname" "info_survivor_position"
		"targetname" "/survivorPos_intro_0[1-4]/"
	}
	delete:
	{
		"SurvivorIntroSequence" "/.*/"
	}
}
{
	match:
	{
		"classname" "logic_relay"
		"targetname" "relay_intro_start"
	}
	delete:
	{
		"OnTrigger" "relay_intro_setupTrigger0-1"
		"OnTrigger" "relay_intro_trainTrigger0-1"
		"OnTrigger" "fade_introFade0-1"
		"OnTrigger" "lcs_intro1Start0-1"
		"OnTrigger" "ghostanim_introSetAnimationc4m1_intro0-1"
		"OnTrigger" "fx_introEnable0-1"
	}
	insert:
	{
		"OnTrigger" "fogexteriorcontrollerSetEndDist25000-1"
		"OnTrigger" "north_1bStartForward0-1"
		"OnTrigger" "relay_intro_finishedTrigger0.1-1"
	}
}
{
	match:
	{
		"classname" "logic_relay"
		"targetname" "relay_intro_finished"
	}
	delete:
	{
		"OnTrigger" "directorFinishIntro2-1"
		"OnTrigger" "relay_scvng_fade_transitionTrigger0-1"
	}
	insert:
	{
		"OnTrigger" "directorFinishIntro0-1"
	}
}
