// Native addon policy. Exact mode entries override the base mode, then default.
// Keep versus content mounted: resource-only campaign VPK parts can otherwise
// be classified as ordinary addons and removed before the next map loads.
// Client addon policy is separately overridden by l4d2_addons_eclipse:
// the server baseline and AstRedux allow addons; competitive modes disable them.
// Restart the server after changing this file to rebuild resource state.
"RestrictAddons"
{
	"default"	"0"
	"versus"	"0"
	"scavenge"	"1"
	"mutation15"	"1" // versus survival
}
