// [l4d_skip_intro.smx] 官图优先跳过；其他地图按 map_rules.cfg 和次数策略处理。
confogl_addcvar l4d_skip_intro_ready 1
confogl_addcvar l4d_skip_intro_play_count 2
confogl_addcvar l4d_skip_intro_official 1

// [player_manager.smx]
confogl_addcvar human_survivor_limit 4
confogl_addcvar keep_survivor_bots 0
confogl_addcvar survivor_bot_cleanup_delay 10.0
confogl_addcvar survivor_reconnect_enabled 1 // Test: same-round recovery after abnormal disconnects.
confogl_addcvar survivor_reconnect_catchup_distance 1500.0 // Catch up when this far behind the team.

// Tank melee range and attack interval (engine cvars).
confogl_addcvar tank_attack_range 70
confogl_addcvar tank_swing_range 75
confogl_addcvar tank_fist_radius 50
confogl_addcvar z_tank_attack_interval 1.25

// [survivor_loadout.smx]
confogl_addcvar preserve_transition_weapons 0
confogl_addcvar give_start_pills 1

// [item_glow.smx]
