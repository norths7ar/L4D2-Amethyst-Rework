// AstRedux component rules and weapon settings.
// Plugin labels name the active implementation; engine/shared rules use functional headings.
// [admin_tools.smx] !guns: one actual weapon of each listed T1 type. empty disables.
confogl_addcvar admin_guns_weapons "smg,smg_silenced,smg_mp5,pumpshotgun,shotgun_chrome"

// [fix_pill_pass.smx]
