// [boss_info.smx]
confogl_addcvar l4d_global_percent 0
confogl_addcvar l4d_tank_percent 1
confogl_addcvar l4d_witch_percent 1

// [script_reloader.smx]
confogl_addcvar sm_vscript_filename astredux.nut

// [ready_pause.smx]
confogl_addcvar ready_enabled 1
