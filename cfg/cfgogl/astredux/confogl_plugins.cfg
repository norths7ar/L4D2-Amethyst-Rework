// AstRedux exceeds the Source engine command buffer when all plugin loads are
// kept in one cfg. Split the list into small, ordered chunks.
// 1: Core, round lifecycle, survivors and resources.
// 2: Spawning, AI and infected rules.
// 3: Player features, HUD and framework finalization. Profiles load last.
exec cfgogl/astredux/plugins_1.cfg
exec cfgogl/astredux/plugins_2.cfg
exec cfgogl/astredux/plugins_3.cfg
