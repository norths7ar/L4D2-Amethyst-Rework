"ResourceRules"
{
	"global"
	{
		// Unlisted resources keep their map-defined behavior. Rule values are
		// "none", a weapon name, or an equally weighted comma-separated list.
		"rules"
		{
			"first_aid_kit"             "none"
			"adrenaline"                "pain_pills"
			"defibrillator"             "none"
			// "smg_mp5"                   "smg_silenced"
			"rifle"                     "smg,smg_silenced,smg_mp5"
			"rifle_desert"              "smg,smg_silenced,smg_mp5"
			"rifle_ak47"                "smg,smg_silenced,smg_mp5"
			"rifle_sg552"               "smg,smg_silenced,smg_mp5"
			"autoshotgun"               "pumpshotgun"
			"shotgun_spas"              "shotgun_chrome"
			"hunting_rifle"             "sniper_scout"
			"sniper_military"           "sniper_scout"
			"sniper_awp"                "sniper_scout"
			"chainsaw"                  "melee"
			"grenade_launcher"          "none"
			"rifle_m60"                 "none"
			"molotov"                   "none"
			"pipe_bomb"                 "none"
			"vomitjar"                  "none"
			"gascan"                    "none"
			"fireworkcrate"             "none"
			"propanetank"               "none"
			"oxygentank"                "none"
			"upgradepack_explosive"     "none"
			"upgradepack_incendiary"    "none"
			"upgrade_item"              "none"
			"mounted_gun"               "none"
		}
		// Let the Director choose from the original weapon pool of the map first.
		// The rules above then downgrade the selected guns without changing spawn points.
		// Optional rules named start/end/along/finale override only the named resources.
		// Same syntax as rules, "none" removes a category, its own name keeps it.
		// Finale overrides end only inside the end supply area on a finale map.
		"regions"
		{
			"start" {}
			"end"   {}
			"along" {}
			"finale" { "first_aid_kit" "pain_pills" }
		}
		"melee_pickups" "1"
		// Loose supplies along the route, counted after replacement. -1 = unlimited.
		// Priority: global < maps/<current map>, per field.
		// flow_min/max are route fractions. flow_density is items per 1000 navigation flow units.
		// min_distance is 3D straight-line Source units. Pills use density 0.3 and distance 500.
		// regions scopes this policy. limit is unchanged. flow_finale 0 skips density/window only.
		"distribution"
		{
			"adrenaline" { "limit" "-1" }
			"first_aid_kit" { "limit" "-1" }
			"defibrillator" { "limit" "-1" }
			"molotov" { "limit" "-1" }
			"pipe_bomb" { "limit" "-1" }
			"vomitjar" { "limit" "-1" }
			"pain_pills"
			{
				"limit" "-1"
				"flow_min"      "0"
				"flow_max"      "1"
				"flow_density"  "0.3"
				"min_distance"  "500"
				"flow_finale"   "0"
				"regions"       "along,unknown"
			}
		}
		// Categories share count/density/distance policies only among members without an individual policy.
		// Overlapping category ownership is an error. These groups are unlimited.
		"categories"
		{
			"recovery"
			{
				"members" "pain_pills,adrenaline,first_aid_kit,defibrillator"
				"limit"   "-1"
			}
			"throwables"
			{
				"members" "molotov,pipe_bomb,vomitjar"
				"limit"   "-1"
			}
		}
	}
