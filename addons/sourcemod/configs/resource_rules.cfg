"ResourceRules"
{
	"global"
	{
		// Unlisted resources keep their map-defined behavior. Rule values are
		// "none", a weapon name, or an equally weighted comma-separated list.
		"rules"
		{
			"first_aid_kit"             "pain_pills"
			"adrenaline"                "pain_pills"
			"defibrillator"             "none"
			"smg_mp5"                   "smg_silenced"
			"rifle"                     "smg,smg_silenced"
			"rifle_desert"              "smg,smg_silenced"
			"rifle_ak47"                "smg,smg_silenced"
			"rifle_sg552"               "smg,smg_silenced"
			"autoshotgun"               "pumpshotgun"
			"shotgun_spas"              "shotgun_chrome"
			"hunting_rifle"             "sniper_scout"
			"sniper_military"           "sniper_scout"
			"sniper_awp"                "sniper_scout"
			"chainsaw"                  "melee"
			"grenade_launcher"          "none"
			"rifle_m60"                 "none"
			"molotov"                   "none"
			"pipe_bomb"                 "none"
			"vomitjar"                  "none"
			"gascan"                    "none"
			"fireworkcrate"             "none"
			"propanetank"               "none"
			"oxygentank"                "none"
			"upgradepack_explosive"     "none"
			"upgradepack_incendiary"    "none"
			"upgrade_item"              "none"
			"mounted_gun"               "none"
		}
		// These categories keep a spawn opportunity while narrowing the engine's pool.
		"weapon_selections"
		{
			"any"              "tier1_any"
			"any_primary"      "tier1_any"
			"tier2_any"        "tier1_any"
			"any_rifle"        "any_smg"
			"any_shotgun"      "tier1_shotgun"
			"tier2_shotgun"    "tier1_shotgun"
			"any_sniper_rifle" "weapon_sniper_scout"
		}
		// Optional rules named start/end/along override only the named resources.
		// Same syntax as rules; "none" removes a category, its own name keeps it.
		// Engine selection keys (e.g. "any_primary" "any_primary") can also override
		// weapon_selections per region. End includes mapinfo-defined finale areas.
		"regions"
		{
			"start" {}
			"end"   {}
			"along" {}
		}
		// Loose supplies along the route, counted after replacement. -1 = unlimited.
		// Priority: global < framework mapinfo < maps/<current map>, per field.
		"ItemLimits"
		{
			"pain_pills"    "-1"
			"adrenaline"    "-1"
			"first_aid_kit" "-1"
			"defibrillator" "-1"
			"molotov"       "-1"
			"pipe_bomb"     "-1"
			"vomitjar"      "-1"
		}
		"melee_pickups" "1"
		// Flow values are fractions of map route length, not straight-line distance.
		// regions applies to both the item's ItemLimits and distribution.
		"distribution"
		{
			"pain_pills"
			{
				"flow_min"      "0"
				"flow_max"      "1"
				"flow_spacing"  "0"
				"flow_finale"   "0"
				"regions"       "along,unknown"
			}
		}
		// Shared caps/spacing run after individual item rules, in declaration order.
		// These groups are defined but impose no additional restrictions by default.
		"categories"
		{
			"recovery"
			{
				"members" "pain_pills,adrenaline,first_aid_kit,defibrillator"
				"limit"   "-1"
			}
			"throwables"
			{
				"members" "molotov,pipe_bomb,vomitjar"
				"limit"   "-1"
			}
		}
	}
	// Exact BSP name. Each map block accepts the same fields as global.
	// Omitted fields inherit; -1 clears a count cap; empty members disables a group.
	"maps"
	{
	}
}
