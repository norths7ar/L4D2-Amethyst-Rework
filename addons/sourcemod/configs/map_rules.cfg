// AstRedux map rules. This is server configuration, maintained in Git.
// Feature plugins and !mset edit the same file; deployment preserves runtime edits.
// static_*: 1 disables FLOW only, 0 permits it within normal spawn restrictions.
// tank_round_*: 1 permits that custom finale round, 0 skips its Tank spawns.
// finale_mode: rounds = editable custom finale; legacy = old stage interception;
// auto = observe the map's stages before offering round controls.
// skip_intro: 1 always skips, 0 uses the existing attempt count.
// Official-map skipping is controlled separately by l4d_skip_intro_official.
// Missing map fields inherit defaults. Saving in game may strip these comments.
